<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumWeb - Web Hosting & Development</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: #121212;
            color: #fff;
            text-align: center;
        }
        header {
            background: rgba(45, 0, 108, 255);
            padding: 10px 20px 20px 20px;
            animation: fadeIn 2s ease-in-out;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 60px;
            height: auto;
        }
        .header-content {
            max-width: 80%;
            padding-top: 20px;
        }
        .logo {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 150px;
            height: 130px;
        }
        h1 {
            font-size: 2.5em;
            margin: 0;
        }
        p {
            font-size: 1.2em;
        }
        #services {
            padding: 50px 20px;
        }
        .service {
            background: rgba(255, 255, 255, 0.1);
            margin: 20px auto;
            padding: 20px;
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.2);
            transition: transform 0.3s;
        }
        #services a {
            text-decoration: none;
            color: white;
        }
        .service:hover {
            transform: scale(1.05);
            background: rgba(45, 0, 108, 255);
        }
        #contact {
            background: #1e1e1e;
            padding: 50px 20px;
        }
        form {
            max-width: 400px;
            margin: auto;
        }
        input, textarea, button {
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            border: none;
            border-radius: 5px;
        }
        input, textarea {
            background: #333;
            color: white;
        }
        button {
            background: rgba(45, 0, 108, 255);
            color: white;
            cursor: pointer;
            font-size: 1.1em;
            transition: background 0.3s;
        }
        button:hover {
            background: #2575fc;
        }
        footer {
            margin-top: 40px;
            padding: 20px;
            background: #1a1a1a;
        }
        footer a {
            color: red;
            text-decoration: none;
            margin: 0 10px;
        }
        footer a i:hover {
            color: #fff;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 1024px) {
  .content {
    margin: 30px 20px;
    padding: 20px;
  }
}

@media (max-width: 768px) {
  header {
    padding: 30px 10px;
  }
  header h1 {
    font-size: 2em;
  }
  .price {
    font-size: 1.8em;
  }
  .btn {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    padding: 14px;
    font-size: 1em;
  }
  .center {
    padding: 0 10px;
  }
  ul.features li {
    font-size: 0.95em;
    padding: 10px 0;
  }
}
 

@media (max-width: 480px) {
  header h1 {
    font-size: 1.6em;
  }
  header p {
    font-size: 0.9em;
  }
  .price {
    font-size: 1.5em;
  }
  .tile {
    padding: 16px;
    font-size: 1em;
  }
  .btn {
    font-size: 0.95em;
    padding: 12px;
    width: 100%;
  }
  .center {
    padding: 0 8px;
  }
  ul.features li i {
    margin-right: 8px;
    font-size: 1em;
  }
}

@media (max-width: 360px) {
  .tile h2 {
    font-size: 1em;
  }
  .tile p {
    font-size: 0.85em;
  }
  .btn {
    font-size: 0.9em;
    padding: 10px;
  }
}
@media (max-width: 768px) {
            .logo {
                width: 80px;
                height: 60px;
                left: 20px;
            top: 50%;
            }
            .header-content {
                max-width: 90%;
                padding-top: 40px;
            }
            h1 {
                font-size: 2em;
            }
        }

        @media (max-width: 480px) {
            .logo {
              width: 60px;
              height: 50px;
                left: 20px;
            top: 50%;
            }
            .header-content {
                max-width: 95%;
                padding-top: 50px;
            }
            h1 {
                font-size: 1.7em;
            }
            p {
                font-size: 1em;
            }
        }


    </style>
</head>
<body>
    <header>
        <img src="logo2.png" alt="QuantumWeb Logo" class="logo">
        <div>
            <h1>QuantumWeb</h1>
            <p>Your gateway to professional websites</p>
        </div>
    </header>
    
    <section id="services">
        <h2>Our Services</h2>
        <a href="web-development.html">
            <div class="service">
                <h3>Web Development</h3>
                <p>We build stunning, responsive websites tailored to your needs.</p>
            </div>
        </a>
        <a href="web-hosting.html">
            <div class="service">
                <h3>Web Hosting</h3>
                <p>Reliable and secure hosting solutions for your business.</p>
            </div>
        </a>
    </section>
    
    <section id="contact">
        <h2>Contact Us</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>
    <footer style="background: #000; padding: 30px 0; text-align: center;">
      <div style="margin-bottom: 10px;">
          <a href="https://facebook.com" target="_blank" style="color: red; margin: 0 10px;text-decoration: none;">
              <i class="fab fa-facebook fa-2x"></i>
          </a>
          <a href="https://twitter.com" target="_blank" style="color: red; margin: 0 10px;text-decoration: none;">
              <i class="fab fa-twitter fa-2x"></i>
          </a>
          <a href="https://instagram.com" target="_blank" style="color: red; margin: 0 10px;text-decoration: none;">
              <i class="fab fa-instagram fa-2x"></i>
          </a>
          <a href="https://linkedin.com" target="_blank" style="color: red; margin: 0 10px;text-decoration: none;">
              <i class="fab fa-linkedin fa-2x"></i>
          </a>
      </div>
      <p style="color: #888;">&copy; 2025 QuantumWeb. All rights reserved.</p>
  </footer>
  
</body>
</html>
