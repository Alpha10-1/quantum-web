<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Starter Web Development - QuantumWeb</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
        font-family: 'Poppins', sans-serif;
        background: #121212;
        color: #fff;
        margin: 0;
        padding: 0;
        }
        header {
        background: linear-gradient(to right, #5f0fff, #8a2be2);
        padding: 40px;
        text-align: center;
        }
        header h1 {
        margin: 0;
        font-size: 2.8em;
        }
        .content {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
        background: #1f1f1f;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .price {
        font-size: 2em;
        color: #8a2be2;
        margin: 20px 0;
        }
        ul.features {
        list-style: none;
        padding: 0;
        }
        ul.features li {
        padding: 10px;
        border-bottom: 1px solid #333;
        display: flex;
        align-items: center;
        }
        ul.features li i {
        margin-right: 10px;
        color: #8a2be2;
        }
        .btn {
        display: inline-block;
        margin-top: 30px;
        padding: 12px 25px;
        border-radius: 10px;
        background: #8a2be2;
        color: #fff;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.3s ease;
        }
        .btn:hover {
        background: #a560f4;
        }
        .center {
        text-align: center;
        }
        @media (max-width: 1024px) {
  .content {
    margin: 30px 20px;
    padding: 20px;
  }
}

@media (max-width: 768px) {
  header {
    padding: 30px 10px;
  }
  header h1 {
    font-size: 2em;
  }
  .price {
    font-size: 1.8em;
  }
  .btn {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    padding: 14px;
    font-size: 1em;
  }
  .center {
    padding: 0 10px;
  }
  ul.features li {
    font-size: 0.95em;
    padding: 10px 0;
  }
}

@media (max-width: 480px) {
  header h1 {
    font-size: 1.6em;
  }
  header p {
    font-size: 0.9em;
  }
  .price {
    font-size: 1.5em;
  }
  .tile {
    padding: 16px;
    font-size: 1em;
  }
  .btn {
    font-size: 0.95em;
    padding: 12px;
    width: 100%;
  }
  .center {
    padding: 0 8px;
  }
  ul.features li i {
    margin-right: 8px;
    font-size: 1em;
  }
}

@media (max-width: 360px) {
  .tile h2 {
    font-size: 1em;
  }
  .tile p {
    font-size: 0.85em;
  }
  .btn {
    font-size: 0.9em;
    padding: 10px;
  }
}

    </style>
</head>
<body>
  <header>
    <h1>Basic Hosting</h1>
    <p>Simple and reliable for personal sites</p>
  </header>
  <section class="content">
    <div class="center"><div class="price">$5/month</div></div>
    <ul class="features">
      <li><i class="fas fa-check-circle"></i> 10GB SSD Storage</li>
      <li><i class="fas fa-check-circle"></i> 1 hosted website</li>
      <li><i class="fas fa-check-circle"></i> Free SSL Certificate</li>
      <li><i class="fas fa-check-circle"></i> 99.9% uptime</li>
      <li><i class="fas fa-check-circle"></i> Email support</li>
    </ul>
    <div class="center">
      <a class="btn" href="mailto:sales@quantumweb.com?subject=Interested in Basic Hosting">Buy Now</a>
      <br><br>
      <a class="btn" href="web-hosting.html">Back to Packages</a>
    </div>
  </section>
</body>
</html>
